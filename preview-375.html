<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>معاينة الهاتف المحمول - 375px</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0f19;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 10px;
      font-family: system-ui, sans-serif;
    }
    .device-frame {
      width: 375px;
      height: 812px;
      border: 12px solid #1e293b;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      background: #ffffff;
      position: relative;
    }
    /* محاكاة النوتش */
    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 22px;
      background: #1e293b;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      z-index: 100;
    }
    iframe {
      width: 375px;
      height: 812px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="device-frame">
    <div class="notch"></div>
    <iframe src="index.html" id="mobileFrame"></iframe>
  </div>
  <script>
    if (window.location.search) {
      document.getElementById('mobileFrame').src = 'index.html' + window.location.search;
    }
  </script>
</body>
</html>
